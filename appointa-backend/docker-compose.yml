services:
  db:
    image: postgres:15-alpine
    container_name: appointa-db
    environment:
      POSTGRES_USER: appointa
      POSTGRES_PASSWORD: appointa123
      POSTGRES_DB: appointa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointa"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: appointa-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://appointa:appointa123@db:5432/appointa
      SECRET_KEY: your-secret-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
